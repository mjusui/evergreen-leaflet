<!DOCTYOE html>
<html>
  <head><title>Evergreen Leaflet</title><meta charset='UTF-8'></meta><style>* { /* * */ margin: 0; border: 0; padding: 0; outline: none; box-sizing: border-box; background-color: rgba(0,0,0,0.0); color: rgba(55,55,55,1.0); font-family: sans-serif; font-size: var(--font-size, 1rem); }
.col { /* flex-col */ display: flex; flex-direction: column; gap: 1rem; }
.row { /* flex-row */ display: flex; flex-direction: row; gap: 1rem; align-items: center; }
.block-col { /* .col */ /* flex-col */ display: flex; flex-direction: column; gap: 1rem; /* block */ margin: 0.5rem; padding: 0.5rem; background-color: rgba(253,253,253,1.0); }
.block-row { /* .row */ /* flex-row */ display: flex; flex-direction: row; gap: 1rem; align-items: center; /* block */ margin: 0.5rem; padding: 0.5rem; background-color: rgba(253,253,253,1.0); }
.block-col-shadow { /* .block-col */ /* .col */ /* flex-col */ display: flex; flex-direction: column; gap: 1rem; /* block */ margin: 0.5rem; padding: 0.5rem; background-color: rgba(253,253,253,1.0); /* shadow */ box-shadow: 0 0 1rem 1px rgba(55,55,55,0.1); }
.block-row-shadow { /* .block-row */ /* .row */ /* flex-row */ display: flex; flex-direction: row; gap: 1rem; align-items: center; /* block */ margin: 0.5rem; padding: 0.5rem; background-color: rgba(253,253,253,1.0); /* shadow */ box-shadow: 0 0 1rem 1px rgba(55,55,55,0.1); }
.bar { /* bar */ margin-bottom: -1px; border-bottom-style: solid; border-bottom-width: 1px; border-bottom-color: rgba(55,55,55,0.1); /* flex-row */ display: flex; flex-direction: row; gap: 1rem; align-items: center; }
.margin { /* center */ margin-left: auto; margin-right: auto; /* middle */ margin-top: auto; margin-bottom: auto; }
button { /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); }
.button-color1 { /* border */ border-style: solid; border-width: 1px; border-color: rgba(55,55,55,0.1); /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); /* color1 */ background-color: rgba(31,181,115,1.0); border-color: rgba(31,181,115,1.0); color: rgba(253,253,253,1.0); }
.button-sign-color1 { /* border */ border-style: solid; border-width: 1px; border-color: rgba(55,55,55,0.1); /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); /* color1 */ background-color: rgba(31,181,115,1.0); border-color: rgba(31,181,115,1.0); color: rgba(253,253,253,1.0); }
input { /* border */ border-style: solid; border-width: 1px; border-color: rgba(55,55,55,0.1); /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); /* input */ min-width: 80vw; font-weight: normal; }
textarea { /* border */ border-style: solid; border-width: 1px; border-color: rgba(55,55,55,0.1); /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); /* input */ min-width: 80vw; font-weight: normal; /* textarea */ min-height: calc(0.4rem + var(--cols) * 1rem); max-height: 30vh; resize: none; }
label { /* button */ padding: 0.2rem; border-radius: 0.2rem; font-weight: bold; --font-size: 0.8rem; min-width: calc(1lh + 0.4rem); /* input */ min-width: 80vw; font-weight: normal; }
label.required::after { /* required */ content: '*'; color: red; }
.modal { /* modal-hidden */ display: none; }
.modal:not(:empty) { /* modal-display */ position: fixed; top: 0; height: 100vh; width: 100%; background-color: rgba(55,55,55,0.5); /* flex-col */ display: flex; flex-direction: column; gap: 1rem; }
.modal:not(:empty) > * { /* center */ margin-left: auto; margin-right: auto; /* middle */ margin-top: auto; margin-bottom: auto; }</style></head>
  <body>
    <main id='display'>
    </main>
    <section id='modal' class='modal' data-onclick='hide-modal'></section>

    <template id='template-guides'>
      <header class='block-row'>
        <h1>ガイド一覧</h1>
        <div class='margin'></div>
        <button class='button-color1' style='--font-size: 1rem'
          data-onclick='open-modal-item-guide'>+</button>
      </header>
      <div class='bar'></div>
      <section id='item-guides' class='block-col load-item-guides'>
      </section>
    </template>
    <template id='template-item-guide'>
      <div class='block-col-shadow'
        data-render1='data-guideid'  data-onclick='open-steps'>
        <h1 style='--font-size: 0.8rem'
          data-render2='textContent' data-onclick='open-steps'></h1>
        <div style='--font-size: 0.6rem'
          data-render3='textContent' data-onclick='open-steps'></div>
      </div>
    </template>

    <template id='template-modal-item-guide'>
      <form class='block-col' data-onsubmit='upsert-item-guide'>
        <input type='hidden' name='id' data-render1='value' required></input>

        <label for='input-title' class='required'>タイトル</label> 
        <input id='input-title' type='text' name='title' data-render2='value' required></input>

        <label for='textarea-desc'>説明</label> 
        <textarea id='textarea-desc' style='--cols: 5'
          name='desc' data-render3='value'></textarea>

        <button type='submit' class='button-color1'>保存</button>
      </form>
    </template>

    <template id='template-steps'>
      <button style='--font-size: 1rem' data-onclick='open-guides'>←</button>
      <header class='block-col'>
        <div class='row'>
          <h1 data-render2='textContent'></h1>
          <div class='margin'></div>
          <button class='button-color1' style='--font-size: 1rem'
            data-render1='data-guideid' data-onclick='open-run'>&gt;</button>
        </div>
        <div style='--font-size: 0.8rem' data-render3='textContent'></div>
      </header>
      <div class='bar'></div>
      <section class='block-col'>
        <div class='bar'>
          <div class='margin'></div>
          <button class='button-color1' style='--font-size: 1rem'
            data-render1='data-guideid' data-onclick='open-modal-item-step'>+</button>
        </div>
      </section>
      <section id='item-steps' class='block-col load-item-steps' data-render1='data-guideid'>
      </section>
    </template>
    <template id='template-item-step'>
      <div class='block-col-shadow' data-render1='data-guideid'
        data-render2='data-id' data-onclick='open-modal-item-step'>
        <h1 style='--font-size: 0.8rem' data-render3='textContent'
          data-onclick='open-modal-item-step'></h1>
        <div class='row'>
          <div style='--font-size: 0.6rem'>取得する値: </div>
          <div style='--font-size: 0.6rem' data-render4='textContent'
            data-onclick='open-modal-item-step'></div>
        </div>
        <div class='row'>
          <div style='--font-size: 0.6rem'>操作説明: </div>
          <div style='--font-size: 0.6rem' data-render5='textContent'
            data-onclick='open-modal-item-step'></div>
        </div>
      </div>
      <div class='bar'>
        <div class='margin'></div>
        <button class='button-color1' style='--font-size: 1rem'
          data-render1='data-guideid' data-render2='data-previd'
          data-onclick='open-modal-item-step'>+</button>
      </div>
    </template>

    <template id='template-modal-item-step'>
      <form class='block-col' data-onsubmit='upsert-item-step'>
        <input type='hidden' name='guideid' data-render1='value' required></input>
        <input type='hidden' name='id' data-render2='value' required></input>
        <input type='hidden' name='previd' data-render3='value' required></input>


        <label for='textarea-url'>ページURL</label> 
        <textarea id='textarea-url' style='--cols: 2'
          name='url' data-render4='value' cols='2'></textarea>

        <label for='textarea-keys' class='required'>取得する値(カンマ区切り)</label> 
        <textarea id='textarea-keys' style='--cols: 2'
          name='keys' data-render5='value' cols='2'></textarea>

        <label for='textarea-inst'>操作説明</label> 
        <textarea id='textarea-inst' style='--cols: 5'
          name='inst' data-render6='value'></textarea>

        <button type='submit' class='button-color1'>保存</button>
      </form>
    </template>


    <template id='template-run'>
      <button style='--font-size: 1rem'
        data-render1='data-guideid'  data-onclick='open-steps'>←</button>
      <header class='block-col'>
        <div class='row'>
          <h1 data-render3='textContent'></h1>
          <div class='margin'></div>
          <!-- <button class='button-color1' style='--font-size: 1.0rem'
            data-render1='data-guideid' data-onclick='open-steps'>-</button> -->
        </div>
        <div style='--font-size: 0.8rem' data-render4='textContent'></div>
      </header>
      <div class='bar'></div>

      <section class='block-col-shadow'>
        <div>(
          <span data-render5='textContent'></span>/<span data-render6='textContent'></span>
        )</div>

        <h1 style='--font-size: 0.8rem' data-render7='textContent'></h1>
        <div id='slot-keys' class='col'></div>
        <pre style='--font-size: 0.8rem' data-render9='textContent'></pre>

        <button class='button-color1' data-render1='data-guideid'
          data-render2='data-stepid' data-onclick='open-run'>次へ</button>
      </section>
    </template>

    <script src='side_panel.js'></script>
  </body>
</html>
